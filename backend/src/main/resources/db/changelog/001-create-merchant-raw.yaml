databaseChangeLog:
  - changeSet:
      id: 001-create-merchant-raw
      author: codex
      changes:
        - createTable:
            tableName: merchant_raw
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: dataset_row_idx
                  type: int
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: domain
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: status
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: ucp_url
                  type: varchar(2048)
                  constraints:
                    nullable: false
              - column:
                  name: http_status
                  type: int
              - column:
                  name: ucp_version
                  type: varchar(64)
              - column:
                  name: has_checkout
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: has_identity_linking
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: has_cart_management
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: has_order
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: has_payment_token
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: capability_count
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: ai_bot_policies
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: transports
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: last_checked_at
                  type: timestamp with time zone
              - column:
                  name: last_success_at
                  type: timestamp with time zone
              - column:
                  name: fetched_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
