spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: meant-api
  datasource:
    url: ${MEANT_DB_URL:jdbc:postgresql://localhost:5433/meant}
    username: ${MEANT_DB_USER:meant}
    password: ${MEANT_DB_PASSWORD:meant}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${MEANT_API_PORT:8080}

crawling:
  ucp-dataset-rows-url: https://datasets-server.huggingface.co/rows?dataset=UCPChecker%2Fucp-merchants&config=default&split=train
  ucp-dataset-page-size: 100
  ucp-dataset-import-cron: "0 0 3 2 * *"
  ucp-dataset-import-zone: UTC

merchant:
  import:
    excluded-domains:
      - ucpchecker.com
  enrichment:
    batch-size: 500
    fixed-delay: 60000
  embedding:
    voyage-base-url: ${VOYAGE_BASE_URL:https://api.voyageai.com}
    api-key: ${VOYAGE_API_KEY:}
    model: ${VOYAGE_EMBEDDING_MODEL:voyage-4-lite}
    dimension: ${VOYAGE_EMBEDDING_DIMENSION:1024}
    batch-size: ${MERCHANT_EMBEDDING_BATCH_SIZE:100}
    fixed-delay: ${MERCHANT_EMBEDDING_FIXED_DELAY:60000}
