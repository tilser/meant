spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: meant-api
  datasource:
    url: ${MEANT_DB_URL:jdbc:postgresql://localhost:5433/meant}
    username: ${MEANT_DB_USER:meant}
    password: ${MEANT_DB_PASSWORD:meant}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SUPABASE_JWKS_URI:#{null}}
          issuer-uri: ${SUPABASE_ISSUER_URI:#{null}}
  web:
    error:
      include-message: never
      include-stacktrace: never
      include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${MEANT_API_PORT:8080}
  # Controls whether forwarded headers (X-Forwarded-For/Forwarded) influence the resolved client IP.
  # Defaults to "none" so direct (non-proxied) deployments ignore client-supplied forwarding headers
  # entirely. Behind a trusted reverse proxy, set to "native" so Tomcat's RemoteIpValve honors those
  # headers only for requests from configured trusted proxies (server.tomcat.remoteip.internal-proxies,
  # default private/loopback ranges); prefer "native" over "framework", whose ForwardedHeaderFilter
  # applies the headers with no trusted-proxy check. See MEA-28.
  forward-headers-strategy: ${MEANT_FORWARD_HEADERS_STRATEGY:none}

rest-client:
  connect-timeout-milliseconds: ${REST_CLIENT_CONNECT_TIMEOUT_MILLISECONDS:5000}
  read-timeout-milliseconds: ${REST_CLIENT_READ_TIMEOUT_MILLISECONDS:30000}

app:
  cors:
    # Defaults support local frontend development only. Production deployments must set
    # APP_CORS_ALLOWED_ORIGINS to explicit browser origins, for example:
    # https://app.example.com,https://admin.example.com
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    expensive-endpoints:
      limits:
        - name: per-minute
          capacity: ${APP_RATE_LIMIT_EXPENSIVE_ENDPOINTS_PER_MINUTE_CAPACITY:20}
          refill-tokens: ${APP_RATE_LIMIT_EXPENSIVE_ENDPOINTS_PER_MINUTE_REFILL_TOKENS:20}
          refill-period: ${APP_RATE_LIMIT_EXPENSIVE_ENDPOINTS_PER_MINUTE_REFILL_PERIOD:1m}
        - name: per-day
          capacity: ${APP_RATE_LIMIT_EXPENSIVE_ENDPOINTS_PER_DAY_CAPACITY:500}
          refill-tokens: ${APP_RATE_LIMIT_EXPENSIVE_ENDPOINTS_PER_DAY_REFILL_TOKENS:500}
          refill-period: ${APP_RATE_LIMIT_EXPENSIVE_ENDPOINTS_PER_DAY_REFILL_PERIOD:1d}
      bucket-cache:
        maximum-size: ${APP_RATE_LIMIT_EXPENSIVE_ENDPOINTS_BUCKET_CACHE_MAXIMUM_SIZE:100000}
        expire-after-access: ${APP_RATE_LIMIT_EXPENSIVE_ENDPOINTS_BUCKET_CACHE_EXPIRE_AFTER_ACCESS:25h}
      endpoints:
        - method: POST
          path: /api/v1/users/me/product-search-qualifications
        - method: POST
          path: /api/v1/users/me/product-searches
        - method: POST
          path: /api/v1/users/me/product-searches:stream
        - method: GET
          path: /api/v1/users/me/products/{canonicalProductKey}
        - method: POST
          path: /api/v1/users/me/product-variant-selections
        - method: GET
          path: /api/users/me/product-search-suggestions
        - method: POST
          path: /api/users/me/inventory/photos
        - method: POST
          path: /api/merchants/semantic-search
        - method: POST
          path: /api/merchants/semantic-product-search
        - method: POST
          path: /api/carts
        - method: PATCH
          path: /api/carts/{cartId}
        - method: POST
          path: /api/carts/{cartId}/checkout/embedded
        - method: POST
          path: /api/carts/{cartId}/checkout/embedded/{sessionId}/complete
        - method: GET
          path: /api/carts/{cartId}/checkout
        - method: POST
          path: /api/discounts/search

ucp:
  agent:
    profile-url: ${UCP_AGENT_PROFILE_URL:https://shopify.dev/ucp/agent-profiles/2026-04-08/valid-with-capabilities.json}
    protocol-version: ${UCP_AGENT_PROTOCOL_VERSION:2026-04-08}
    signing-key-id: ${UCP_AGENT_SIGNING_KEY_ID:meant-local}
  diagnostics:
    checkout-wire-logging-enabled: ${UCP_CHECKOUT_WIRE_LOGGING_ENABLED:false}
  signing:
    signature-ttl: ${UCP_SIGNING_SIGNATURE_TTL:PT5M}
    clock-skew: ${UCP_SIGNING_CLOCK_SKEW:PT30S}
    keys: []
  capability-readiness:
    direct-checkout-completion-authorized: ${UCP_DIRECT_CHECKOUT_COMPLETION_AUTHORIZED:false}
    order-reads-authorized: ${UCP_ORDER_READS_AUTHORIZED:true}
    order-webhooks-authorized: ${UCP_ORDER_WEBHOOKS_AUTHORIZED:false}

commerce:
  checkout:
    embedded:
      session-ttl: ${COMMERCE_EMBEDDED_CHECKOUT_SESSION_TTL:5m}
      supported-protocol-version: ${COMMERCE_EMBEDDED_CHECKOUT_PROTOCOL_VERSION:2026-04-08}
  cart:
    retry:
      max-reconciliation-delay: ${COMMERCE_CART_MAX_RECONCILIATION_DELAY:2s}
  catalog:
    federation:
      overall-deadline: ${COMMERCE_CATALOG_FEDERATION_OVERALL_DEADLINE:15s}
    data-use:
      generic-ucp:
        search-cache-ttl: ${GENERIC_UCP_SEARCH_CACHE_TTL:24h}
        rehydrated-facts-ttl: ${GENERIC_UCP_REHYDRATED_FACTS_TTL:2m}
  execution-policy:
    catalog-rollout-enabled: ${COMMERCE_CATALOG_ROLLOUT_ENABLED:true}
    cart-rollout-enabled: ${COMMERCE_CART_ROLLOUT_ENABLED:true}
    checkout-session-rollout-enabled: ${COMMERCE_CHECKOUT_SESSION_ROLLOUT_ENABLED:true}
    embedded-checkout-rollout-enabled: ${COMMERCE_EMBEDDED_CHECKOUT_ROLLOUT_ENABLED:true}
    direct-checkout-completion-rollout-enabled: ${COMMERCE_DIRECT_CHECKOUT_COMPLETION_ROLLOUT_ENABLED:false}
    order-reads-rollout-enabled: ${COMMERCE_ORDER_READS_ROLLOUT_ENABLED:true}
    order-webhooks-rollout-enabled: ${COMMERCE_ORDER_WEBHOOKS_ROLLOUT_ENABLED:true}

shopify:
  agent-auth:
    enabled: ${SHOPIFY_AGENT_AUTH_ENABLED:true}
    environment: ${SHOPIFY_AGENT_AUTH_ENVIRONMENT:local}
    client-id: ${SHOPIFY_CLIENT_ID:}
    client-secret: ${SHOPIFY_CLIENT_SECRET:}
    token-endpoint: ${SHOPIFY_TOKEN_ENDPOINT:https://api.shopify.com/auth/access_token}
    refresh-skew: ${SHOPIFY_TOKEN_REFRESH_SKEW:5m}
    fallback-token-ttl: ${SHOPIFY_TOKEN_FALLBACK_TTL:60m}
  global-catalog:
    data-use:
      # Search payloads stay session-only until a reviewed legal/product approval enables bounded storage.
      search-persistence-approved: ${SHOPIFY_GLOBAL_CATALOG_SEARCH_PERSISTENCE_APPROVED:false}
      approved-search-cache-ttl: ${SHOPIFY_GLOBAL_CATALOG_APPROVED_SEARCH_CACHE_TTL:15m}
      rehydrated-facts-ttl: ${SHOPIFY_GLOBAL_CATALOG_REHYDRATED_FACTS_TTL:2m}
    discovery-enabled: ${SHOPIFY_GLOBAL_CATALOG_DISCOVERY_ENABLED:true}
    endpoint: ${SHOPIFY_GLOBAL_CATALOG_ENDPOINT:https://catalog.shopify.com/api/ucp/mcp}
    allowed-hosts: ${SHOPIFY_GLOBAL_CATALOG_ALLOWED_HOSTS:catalog.shopify.com}
    protocol-version: ${SHOPIFY_GLOBAL_CATALOG_PROTOCOL_VERSION:2026-04-08}
    default-result-limit: ${SHOPIFY_GLOBAL_CATALOG_DEFAULT_RESULT_LIMIT:10}
    maximum-result-limit: ${SHOPIFY_GLOBAL_CATALOG_MAXIMUM_RESULT_LIMIT:50}
    maximum-lookup-ids: ${SHOPIFY_GLOBAL_CATALOG_MAXIMUM_LOOKUP_IDS:50}
    maximum-candidates: ${SHOPIFY_GLOBAL_CATALOG_MAXIMUM_CANDIDATES:200}
    maximum-concurrent-requests: ${SHOPIFY_GLOBAL_CATALOG_MAXIMUM_CONCURRENT_REQUESTS:16}
    connect-timeout: ${SHOPIFY_GLOBAL_CATALOG_CONNECT_TIMEOUT:2s}
    read-timeout: ${SHOPIFY_GLOBAL_CATALOG_READ_TIMEOUT:8s}
    request-deadline: ${SHOPIFY_GLOBAL_CATALOG_REQUEST_DEADLINE:10s}
    circuit-failure-threshold: ${SHOPIFY_GLOBAL_CATALOG_CIRCUIT_FAILURE_THRESHOLD:3}
    circuit-open-duration: ${SHOPIFY_GLOBAL_CATALOG_CIRCUIT_OPEN_DURATION:30s}
  cart:
    profile-freshness: ${SHOPIFY_CART_PROFILE_FRESHNESS:840h}
    connect-timeout: ${SHOPIFY_CART_CONNECT_TIMEOUT:2s}
    read-timeout: ${SHOPIFY_CART_READ_TIMEOUT:8s}
    request-deadline: ${SHOPIFY_CART_REQUEST_DEADLINE:10s}
    max-retry-delay: ${SHOPIFY_CART_MAX_RETRY_DELAY:2s}
  capability-readiness:
    authorization-tier: ${SHOPIFY_AUTHORIZATION_TIER:TOKEN}
    granted-scopes: ${SHOPIFY_GRANTED_SCOPES:}
    embedded-checkout-advertised: ${SHOPIFY_EMBEDDED_CHECKOUT_ADVERTISED:true}
    embedded-checkout-authorized: ${SHOPIFY_EMBEDDED_CHECKOUT_AUTHORIZED:true}
    direct-checkout-completion-advertised: ${SHOPIFY_DIRECT_CHECKOUT_COMPLETION_ADVERTISED:false}
    direct-checkout-completion-authorized: ${SHOPIFY_DIRECT_CHECKOUT_COMPLETION_AUTHORIZED:false}
    direct-checkout-completion-required-scopes: ${SHOPIFY_DIRECT_CHECKOUT_COMPLETION_REQUIRED_SCOPES:complete_checkout}
    order-reads-authorized: ${SHOPIFY_ORDER_READS_AUTHORIZED:false}
    order-reads-required-scopes: ${SHOPIFY_ORDER_READS_REQUIRED_SCOPES:read_orders}
    order-webhooks-authorized: ${SHOPIFY_ORDER_WEBHOOKS_AUTHORIZED:false}

order:
  webhook:
    shopify-secret: ${ORDER_SHOPIFY_WEBHOOK_SECRET:}

discount:
  code-search:
    candidate-cache-ttl: ${DISCOUNT_CODE_SEARCH_CANDIDATE_CACHE_TTL:48h}
    invalid-cache-ttl: ${DISCOUNT_CODE_SEARCH_INVALID_CACHE_TTL:12h}
    failed-cache-ttl: ${DISCOUNT_CODE_SEARCH_FAILED_CACHE_TTL:1h}
    max-candidates: ${DISCOUNT_CODE_SEARCH_MAX_CANDIDATES:10}
    openrouter-model: ${DISCOUNT_CODE_SEARCH_OPENROUTER_MODEL:openai/gpt-5.2:online}
    web-max-results: ${DISCOUNT_CODE_SEARCH_WEB_MAX_RESULTS:8}

review:
  provider-discovery:
    batch-size: ${REVIEW_PROVIDER_DISCOVERY_BATCH_SIZE:50}
    fixed-delay: ${REVIEW_PROVIDER_DISCOVERY_FIXED_DELAY:1h}
    storefront-timeout: ${REVIEW_PROVIDER_DISCOVERY_STOREFRONT_TIMEOUT:5s}
    storefront-max-bytes: ${REVIEW_PROVIDER_DISCOVERY_STOREFRONT_MAX_BYTES:2097152}
    claim-duration: ${REVIEW_PROVIDER_DISCOVERY_CLAIM_DURATION:10m}
    retry-delay: ${REVIEW_PROVIDER_DISCOVERY_RETRY_DELAY:1d}
    not-found-recheck-delay: ${REVIEW_PROVIDER_DISCOVERY_NOT_FOUND_RECHECK_DELAY:14d}
  cache:
    ttl: ${REVIEW_CACHE_TTL:6h}
    maximum-size: ${REVIEW_CACHE_MAXIMUM_SIZE:10000}
  providers:
    klaviyo:
      reviews-base-url: ${REVIEW_KLAVIYO_REVIEWS_BASE_URL:https://fast.a.klaviyo.com/reviews/api}
      default-limit: ${REVIEW_KLAVIYO_DEFAULT_LIMIT:20}
    yotpo:
      reviews-base-url: ${REVIEW_YOTPO_REVIEWS_BASE_URL:https://api-cdn.yotpo.com/v1/widget}
      default-limit: ${REVIEW_YOTPO_DEFAULT_LIMIT:20}
    okendo:
      reviews-base-url: ${REVIEW_OKENDO_REVIEWS_BASE_URL:https://api.okendo.io/v1}
      default-limit: ${REVIEW_OKENDO_DEFAULT_LIMIT:20}

ai:
  openrouter:
    base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
    api-key: ${OPENROUTER_API_KEY:}
    app-title: ${OPENROUTER_APP_TITLE:Meant}
    models:
      preference-filter-parser: ${OPENROUTER_PREFERENCE_FILTER_MODEL:google/gemini-2.5-flash-lite}
      product-search-query-parser: ${OPENROUTER_PRODUCT_SEARCH_QUERY_MODEL:openrouter/free}
      product-recommendation-explainer: ${OPENROUTER_PRODUCT_EXPLAINER_MODEL:google/gemini-2.5-flash-lite}
      chat-model: ${OPENROUTER_CHAT_MODEL:google/gemini-2.5-flash-lite}

user:
  collections:
    saved-products:
      default-limit: ${USER_COLLECTIONS_SAVED_PRODUCTS_DEFAULT_LIMIT:50}
      max-limit: ${USER_COLLECTIONS_SAVED_PRODUCTS_MAX_LIMIT:100}
      quota: ${USER_COLLECTIONS_SAVED_PRODUCTS_QUOTA:500}
      discovery-limit: ${USER_COLLECTIONS_SAVED_PRODUCTS_DISCOVERY_LIMIT:50}
    inventory:
      default-limit: ${USER_COLLECTIONS_INVENTORY_DEFAULT_LIMIT:50}
      max-limit: ${USER_COLLECTIONS_INVENTORY_MAX_LIMIT:100}
      quota: ${USER_COLLECTIONS_INVENTORY_QUOTA:500}
  product-search:
    search-version: v4
    query-parser-prompt-version: v2
    explanation-prompt-version: v3
    cache-ttl: 24h
    product-detail-session-ttl: ${USER_PRODUCT_DETAIL_SESSION_TTL:30m}
    product-detail-session-maximum-size: ${USER_PRODUCT_DETAIL_SESSION_MAXIMUM_SIZE:10000}
    stream-timeout: ${USER_PRODUCT_SEARCH_STREAM_TIMEOUT:45s}
    stream-queue-capacity: ${USER_PRODUCT_SEARCH_STREAM_QUEUE_CAPACITY:128}
    discovery-recent-search-limit: 5
    discovery-recent-product-limit: 12
    popular-search-window: 24h
    popular-search-fallback-window: 7d
    popular-search-limit: 6
    popular-search-min-distinct-users: 3
    popular-search-max-display-length: 80

crawling:
  ucp-dataset-rows-url: https://datasets-server.huggingface.co/rows?dataset=UCPChecker%2Fucp-merchants&config=default&split=train
  ucp-dataset-page-size: 100
  ucp-dataset-import-cron: "0 0 3 2 * *"
  ucp-dataset-import-zone: UTC

merchant:
  import:
    excluded-domains:
      - ucpchecker.com
  enrichment:
    batch-size: ${MERCHANT_ENRICHMENT_BATCH_SIZE:50}
    fixed-delay: ${MERCHANT_ENRICHMENT_FIXED_DELAY:60000}
    retry-delay: ${MERCHANT_ENRICHMENT_RETRY_DELAY:1d}
  ucp-profile-observation:
    ttl: ${MERCHANT_UCP_PROFILE_OBSERVATION_TTL:10m}
    maximum-size: ${MERCHANT_UCP_PROFILE_OBSERVATION_MAXIMUM_SIZE:500}
  mcp-tool:
    connect-timeout-milliseconds: ${MERCHANT_MCP_TOOL_CONNECT_TIMEOUT_MILLISECONDS:5000}
    read-timeout-milliseconds: ${MERCHANT_MCP_TOOL_READ_TIMEOUT_MILLISECONDS:5000}
    merchant-timeout-milliseconds: ${MERCHANT_MCP_TOOL_MERCHANT_TIMEOUT_MILLISECONDS:15000}
    tools-list-cache-ttl: ${MERCHANT_MCP_TOOL_TOOLS_LIST_CACHE_TTL:1h}
  identity-linking:
    client-id: ${MERCHANT_IDENTITY_LINKING_CLIENT_ID:meant-local}
    client-secret: ${MERCHANT_IDENTITY_LINKING_CLIENT_SECRET:}
    redirect-uri: ${MERCHANT_IDENTITY_LINKING_REDIRECT_URI:http://localhost:3000/oauth/merchant-callback}
    token-encryption-secret: ${MERCHANT_IDENTITY_LINKING_TOKEN_ENCRYPTION_SECRET:local-development-merchant-identity-token-secret}
    default-scopes:
      - dev.ucp.shopping.order:read
      - dev.ucp.shopping.account:manage
      - dev.ucp.shopping.loyalty:read
    refresh-skew: ${MERCHANT_IDENTITY_LINKING_REFRESH_SKEW:5m}
  embedding:
    voyage-base-url: ${VOYAGE_BASE_URL:https://api.voyageai.com}
    api-key: ${VOYAGE_API_KEY:}
    model: ${VOYAGE_EMBEDDING_MODEL:voyage-4-lite}
    rerank-model: ${VOYAGE_RERANK_MODEL:rerank-2.5-lite}
    dimension: ${VOYAGE_EMBEDDING_DIMENSION:1024}
    batch-size: ${MERCHANT_EMBEDDING_BATCH_SIZE:5}
    fixed-delay: ${MERCHANT_EMBEDDING_FIXED_DELAY:600000}
  catalog-search:
    merchant-candidate-limit: ${MERCHANT_CATALOG_SEARCH_MERCHANT_CANDIDATE_LIMIT:30}
    merchant-limit: ${MERCHANT_CATALOG_SEARCH_MERCHANT_LIMIT:5}
    products-per-merchant: ${MERCHANT_CATALOG_SEARCH_PRODUCTS_PER_MERCHANT:10}
    product-limit: ${MERCHANT_CATALOG_SEARCH_PRODUCT_LIMIT:20}
