spring:
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

rest-client:
  connect-timeout-milliseconds: 5000
  read-timeout-milliseconds: 30000

app:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://127.0.0.1:3000
  rate-limit:
    enabled: true
    expensive-endpoints:
      limits:
        - name: per-minute
          capacity: 20
          refill-tokens: 20
          refill-period: 1m
        - name: per-day
          capacity: 500
          refill-tokens: 500
          refill-period: 1d
      bucket-cache:
        maximum-size: 100000
        expire-after-access: 25h
      endpoints:
        - method: POST
          path: /api/users/me/product-searches
        - method: GET
          path: /api/users/me/product-search-suggestions
        - method: POST
          path: /api/users/me/inventory/photos
        - method: POST
          path: /api/users/me/assistant/messages:stream
        - method: POST
          path: /api/merchants/semantic-search
        - method: POST
          path: /api/merchants/semantic-product-search
        - method: POST
          path: /api/carts
        - method: PATCH
          path: /api/carts/{cartId}
        - method: GET
          path: /api/carts/{cartId}/checkout

ai:
  openrouter:
    base-url: https://openrouter.ai/api/v1
    api-key: ""
    app-title: Meant
    models:
      preference-filter-parser: google/gemini-2.5-flash-lite
      product-search-query-parser: google/gemini-2.0-flash-lite-001
      product-recommendation-explainer: google/gemini-2.5-flash-lite
      chat-model: openrouter/free

user:
  collections:
    saved-products:
      default-limit: 50
      max-limit: 100
      quota: 500
      discovery-limit: 50
      assistant-context-limit: 20
    inventory:
      default-limit: 50
      max-limit: 100
      quota: 500
  product-search:
    search-version: v2
    query-parser-prompt-version: v2
    explanation-prompt-version: v1
    cache-ttl: 24h
    discovery-recent-search-limit: 5
    discovery-recent-product-limit: 12
    popular-search-window: 24h
    popular-search-fallback-window: 7d
    popular-search-limit: 6
    popular-search-min-distinct-users: 3
    popular-search-max-display-length: 80

crawling:
  ucp-dataset-rows-url: https://datasets-server.huggingface.co/rows?dataset=UCPChecker%2Fucp-merchants&config=default&split=train
  ucp-dataset-page-size: 100
  ucp-dataset-import-cron: "0 0 3 2 * *"
  ucp-dataset-import-zone: UTC

merchant:
  import:
    excluded-domains:
      - ucpchecker.com
  enrichment:
    batch-size: 25
    fixed-delay: 60000
  mcp-tool:
    connect-timeout-milliseconds: 5000
    read-timeout-milliseconds: 5000
  identity-linking:
    client-id: meant-test
    client-secret: test-secret
    redirect-uri: http://localhost:3000/oauth/merchant-callback
    token-encryption-secret: test-merchant-identity-link-token-secret
    default-scopes:
      - dev.ucp.shopping.order:read
      - dev.ucp.shopping.account:manage
      - dev.ucp.shopping.loyalty:read
    refresh-skew: 5m
  embedding:
    voyage-base-url: https://api.voyageai.com
    api-key: ""
    model: voyage-4-lite
    rerank-model: rerank-2.5-lite
    dimension: 1024
    batch-size: 25
    fixed-delay: 120000
  catalog-search:
    merchant-candidate-limit: 30
    merchant-limit: 5
    products-per-merchant: 10
    product-limit: 20
