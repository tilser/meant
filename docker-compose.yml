services:
  postgres:
    image: postgres:17-alpine
    container_name: meant-postgres
    environment:
      POSTGRES_DB: meant
      POSTGRES_USER: meant
      POSTGRES_PASSWORD: meant
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meant -d meant"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
